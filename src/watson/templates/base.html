<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Watson{% endblock %}</title>
  <script src="{{ url('static/theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ url('static/basecoat.css') }}">
  <link rel="stylesheet" href="{{ url('static/theme.css') }}">
  <link rel="stylesheet" href="{{ url('static/watson.css') }}">
  <link rel="stylesheet" href="{{ url('static/settings.css') }}">
  <script src="{{ url('static/watson.js') }}" defer></script>
</head>
<body class="min-h-screen bg-background text-foreground">
  <header class="site-header">
    <a class="brand" href="{{ url() }}" aria-label="Watson projects">
      <span class="brand-mark">W</span>
      <span>Watson</span>
    </a>
    <div class="header-tools">
      <a class="btn" data-variant="outline" href="https://shaheedazaad.github.io/watson/" target="_blank" rel="noopener">Docs</a>
      <a class="btn" data-variant="ghost" data-size="icon" href="{{ url('settings') }}" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <button type="button" class="btn" data-variant="ghost" data-size="icon" data-theme-toggle aria-label="Toggle dark mode">
        <svg data-icon="sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg data-icon="moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      </button>
    </div>
  </header>
  <main class="shell">
    {% if update_available %}<div class="alert alert-warning" role="status"><section><p>A Watson update is available. <a href="https://shaheedazaad.github.io/watson/" target="_blank" rel="noopener">Read the update instructions in the documentation.</a></p></section></div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
