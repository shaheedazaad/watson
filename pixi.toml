[workspace]
name = "watson"
version = "0.2.1"
description = "Private localhost app for preregistration adherence review"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "win-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.14"
pip = ">=24"

[pypi-dependencies]
watson-research-cli = { path = ".", editable = true }

[feature.dev.pypi-dependencies]
pytest = ">=8.0,<9"
httpx = ">=0.27,<1"

[environments]
default = { features = ["dev"] }

[tasks]
watson = "watson"
test = "pytest"
verify-assets = "python scripts/check_runtime_assets.py"
