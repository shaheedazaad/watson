[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "watson-research-cli"
version = "0.1.0"
description = "CLI for inventorying psychology articles, preregistrations, and supplemental materials."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "click>=8.1,<8.2",
  "google-genai>=1.47,<2",
  "keyring>=25,<26",
  "pydantic>=2.7,<3",
  "pypdf>=6.13,<7",
  "pyyaml>=6,<7",
  "python-docx>=1.2,<2",
  "rich>=13.9,<14",
  "textual>=0.89,<1",
  "typer>=0.12.5,<0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
watson = "watson.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/watson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
